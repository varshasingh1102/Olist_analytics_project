version: 2

models:

  - name: fct_orders
    description: "Order-level fact table containing order status and delivery performance metrics."
    columns:
      - name: order_id
        description: "Unique identifier for each order."
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: "Customer associated with the order."
        data_tests:
          - not_null

      - name: order_status
        description: "Current status of the order."
        data_tests:
          - not_null

  - name: fct_order_items
    description: "Item-level fact table containing product, seller, price and freight information."
    columns:
      - name: order_id
        description: "Order associated with the item."
        data_tests:
          - not_null

      - name: product_id
        description: "Product associated with the order item."
        data_tests:
          - not_null

      - name: seller_id
        description: "Seller associated with the order item."
        data_tests:
          - not_null

  - name: dim_customers
    description: "Customer dimension containing customer location and identifiers."
    columns:
      - name: customer_id
        description: "Unique customer identifier."
        data_tests:
          - not_null
          - unique

  - name: dim_products
    description: "Product dimension containing product attributes and translated categories."
    columns:
      - name: product_id
        description: "Unique product identifier."
        data_tests:
          - not_null
          - unique

  - name: dim_sellers
    description: "Seller dimension containing seller location information."
    columns:
      - name: seller_id
        description: "Unique seller identifier."
        data_tests:
          - not_null
          - unique